name: nqata_client
description: Nqata - application client (carte de fidélité)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  geolocator: ^13.0.1
  wakelock_plus: ^1.2.8
  crypto: ^3.0.3
  flutter_svg: ^2.0.10+1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - mascot_hero.jpg
    - coin.png
    - robot.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
