name: Build Client APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Générer le dossier android
        run: |
          flutter create --platforms=android --org dz.nqata --project-name nqata_client _gen
          cp -r _gen/android ./android
          rm -rf _gen

      - name: Permission internet et nom de l'app
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="nqata_client"|android:label="Nqata"|' android/app/src/main/AndroidManifest.xml

      - name: Empreinte digitale (l'activité principale doit être un FragmentActivity)
        run: |
          f=$(find android -name MainActivity.kt)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$f"

      - name: Signature stable de l'APK (si les secrets sont renseignés)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.p12
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          sc = '''    signingConfigs {
              create("release") {
                  keyAlias = System.getenv("KEY_ALIAS")
                  keyPassword = System.getenv("KEY_PASSWORD")
                  storeFile = file("upload-keystore.p12")
                  storePassword = System.getenv("KEYSTORE_PASSWORD")
                  storeType = "pkcs12"
              }
          }

              buildTypes {'''
          assert '    buildTypes {' in s and 'signingConfigs.getByName("debug")' in s, 'modèle Gradle inattendu'
          p.write_text(s.replace('    buildTypes {', sc, 1).replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")'))
          PY

      - run: flutter pub get
      - name: Icône de l'app
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "client-${{ github.run_number }}" build/app/outputs/flutter-apk/app-release.apk --repo "${{ github.repository }}" --title "Nqata Client ${{ github.run_number }}" --notes "Version automatique"
